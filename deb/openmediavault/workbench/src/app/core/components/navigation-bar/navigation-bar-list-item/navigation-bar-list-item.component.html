<!-- The tooltip shows the full text if it is truncated. The `aria-label`
     prevents screen readers from announcing the text twice, because the
     tooltip is not added as description if it equals the `aria-label`. -->
<mat-list-item role="listitem"
               tabindex="0"
               [activated]="item.active"
               [style.padding-left.px]="16 + depth * 24"
               [attr.aria-label]="item.text | transloco"
               [attr.aria-expanded]="item.children?.length > 0 ? item.expanded : null"
               [matTooltip]="item.text | transloco"
               [matTooltipShowDelay]="500"
               (mouseenter)="updateTooltip()"
               (click)="onClick(item)"
               (keydown.enter)="onKeydownActivate($event)"
               (keydown.space)="onKeydownActivate($event)">
  <mat-icon matListItemIcon
            svgIcon="{{ item.icon | mapIconEnum }}"></mat-icon>
  <span #title
        matListItemTitle
        class="omv-display-block omv-text-truncate">
    {{ item.text | transloco }}
  </span>
  <mat-icon *ngIf="item.children?.length > 0"
            matListItemMeta
            svgIcon="{{ item.expanded ? icon.chevronDown : icon.chevronRight }}"></mat-icon>
</mat-list-item>
<div *ngIf="item.expanded && item.children?.length > 0">
  <omv-navigation-bar-list-item *ngFor="let child of item.children"
                                [item]="child"
                                [depth]="depth + 1">
  </omv-navigation-bar-list-item>
</div>
