<mat-list-item role="listitem"
               [ngClass]="{'active': item.active}"
               [style.padding-left.px]="16 + depth * 32"
               (click)="onClick(item)">
  <mat-icon matListItemIcon
            svgIcon="{{ item.icon | mapIconEnum }}"></mat-icon>
  <span matListItemTitle
        class="omv-text-truncate">
    {{ item.text | transloco }}
  </span>
  <mat-icon *ngIf="item.children?.length > 0"
            matListItemMeta
            svgIcon="{{ item.expanded ? icon.chevronDown : icon.chevronRight }}"></mat-icon>
</mat-list-item>
<div *ngIf="item.expanded && item.children?.length > 0">
  <omv-navigation-bar-list-item *ngFor="let child of item.children"
                                [item]="child"
                                [depth]="depth + 1">
  </omv-navigation-bar-list-item>
</div>
