<ng-container *ngTemplateOutlet="renderDialogHeader"></ng-container>
<mat-dialog-content>
  <omv-intuition-form [id]="config.id"
                      [config]="config.fields">
  </omv-intuition-form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button *ngIf="config.buttons.cancel && !config.buttons.cancel.hidden"
          mat-flat-button
          class="omv-background-color-pair-accent"
          (click)="onCancel()">
    {{ config.buttons.cancel.text | transloco }}
  </button>
  <omv-submit-button *ngIf="config.buttons.submit && !config.buttons.submit.hidden"
                     cdkFocusInitial
                     [form]="config.id"
                     [formGroup]="form.formGroup"
                     [disabled]="form.formGroup.pristine"
                     (buttonClick)="onSubmit()">
    {{ config.buttons.submit.text | transloco }}
  </omv-submit-button>
</mat-dialog-actions>

<ng-template #renderDialogHeader>
  <div *ngIf="config.title || config.subTitle"
       mat-dialog-title
       class="omv-display-flex omv-align-items-center">
    <mat-icon *ngIf="config.icon"
              class="omv-pr-h"
              svgIcon="{{ config.icon }}">
    </mat-icon>
    <div>
      <div *ngIf="config.title">
        {{ config.title | transloco }}
      </div>
      <div *ngIf="config.subTitle"
           class="omv-form-dialog-subtitle">
        {{ config.subTitle | transloco }}
      </div>
    </div>
  </div>
</ng-template>
